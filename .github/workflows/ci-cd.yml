name: CI/CD Pipeline for Spring Boot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test, Dockerize, and Deploy
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 21 (Temurin)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4️⃣ Build your app with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 5️⃣ Log in to DockerHub
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6️⃣ Build and push Docker image
      - name: Build and push Docker image
        run: |
          docker build -t springboot-tasklist .
          docker tag springboot-tasklist ${{ secrets.DOCKERHUB_USERNAME }}/springboot-tasklist:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-tasklist:latest

      # 7️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 8️⃣ Configure kubeconfig
      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      # 9️⃣ Deploy to Kubernetes
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 🔟 (Optional) Run container on self-hosted runner
      - name: Run container locally for testing
        run: |
          echo "🚀 Starting container on self-hosted runner..."
          docker run -d -p 8080:8080 --name springboot-tasklist springboot-tasklist

          echo "⏳ Waiting for app to start..."
          sleep 15

          echo "🔍 Checking running containers..."
          docker ps

          echo "📜 Logs:"
          docker logs springboot-tasklist

          echo "✅ Testing endpoint..."
          curl -f http://localhost:8080 || (echo "❌ App not responding" && exit 1)

          echo "🧹 Cleaning up..."
          docker stop springboot-tasklist
          docker rm springboot-tasklist

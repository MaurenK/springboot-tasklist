name: CI/CD Pipeline for Spring Boot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test, and Dockerize
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set up Java 21 (Temurin)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Cache Maven dependencies (speeds up future builds)
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # 4️⃣ Build your app with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

           
      # 5️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t springboot-tasklist .
      - name: Tag and Push Docker image
        run: |
          docker tag springboot-tasklist ${{ secrets.DOCKERHUB_USERNAME }}/springboot-tasklist:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/springboot-tasklist:latest


      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml


      # 6️⃣ (Optional) Run container for testing
      - name: Run container
        run: |
          docker run -d -p 8080:8080 --name springboot-tasklist springboot-tasklist
          sleep 10
          docker ps -a
          docker logs springboot-tasklist
